apiVersion: apps/v1

kind: Deployment

metadata:

  name: nodeport-deployment

    labels:

        app: nodeport-app

        spec:

          replicas: 2

            selector:

                matchLabels:

                      app: nodeport-app

                        template:

                            metadata:

                                  labels:

                                          app: nodeport-app

                                              spec:

                                                    containers:

                                                          - name: nginx

                                                                  image: nginx:stable

                                                                          ports:

                                                                                  - containerPort: 80
